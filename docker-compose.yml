services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ecodescarte}
      POSTGRES_USER: ${DB_USERNAME:-ecodescarte}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      # Cria o banco de testes junto com o de desenvolvimento.
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-ecodescarte}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ecodescarte}
      DB_USERNAME: ${DB_USERNAME:-ecodescarte}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - '${APP_PORT:-8000}:8000'
    volumes:
      - .:/app
      - /app/vendor
      - /app/node_modules

volumes:
  db-data:
