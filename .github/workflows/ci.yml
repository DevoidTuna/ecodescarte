name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Feature tests (PostgreSQL)
    runs-on: ubuntu-latest

    # Mesmas credenciais do .env.testing, para que a suíte rode sem
    # nenhuma variável de ambiente extra.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecodescarte_test
          POSTGRES_USER: ecodescarte
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run migrations
        run: php artisan migrate --force --env=testing

      - name: Run tests
        run: php artisan test

  build:
    name: Build assets and image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Build Docker image
        run: docker build -t ecodescarte:ci .
