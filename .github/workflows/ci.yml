name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Feature tests (PostgreSQL)
    runs-on: ubuntu-latest

    # The same credentials as .env.testing, so the suite runs without any
    # extra environment variables.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecodescarte_test
          POSTGRES_USER: ecodescarte
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run migrations
        run: php artisan migrate --force --env=testing

      - name: Run tests
        run: php artisan test

  build:
    name: Build assets and image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Build Docker image
        run: docker build -t ecodescarte:ci .

  smoke:
    name: Boot the stack end to end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Boots exactly the way a fresh clone would: one command, nothing manual.
      - name: docker compose up
        run: docker compose up --build -d

      - name: Wait for the server to accept connections
        run: |
          for i in $(seq 1 40); do
            if curl -sS -o /dev/null http://localhost:8000 2>/dev/null; then
              echo "servidor aceitando conexões na tentativa $i"
              exit 0
            fi
            sleep 5
          done
          echo "servidor não aceitou conexões"
          exit 1

      # Proves the entrypoint migrated and seeded the database: the seeded
      # points must be coming back from the API.
      - name: The seeded points must be served
        run: |
          curl -sS -o points.json -w 'status=%{http_code}\n' --fail http://localhost:8000/api/points
          grep -q 'Ecoponto' points.json

      - name: The SPA shell must render
        run: curl -sS -o /dev/null --fail http://localhost:8000

      - name: Diagnose on failure
        if: failure()
        run: |
          echo "--- GET / ---"
          curl -sS -o body.html -w 'status=%{http_code}\n' http://localhost:8000 || true
          head -c 3000 body.html || true
          echo "--- GET /api/points ---"
          curl -sS -w 'status=%{http_code}\n' http://localhost:8000/api/points | head -c 500 || true
          echo "--- public/build ---"
          docker compose exec -T app ls -la public/build || true

      - name: Show entrypoint output
        if: always()
        run: docker compose logs app

      - name: Tear down
        if: always()
        run: docker compose down -v
